<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Getränke-Wunschliste</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* HIER IST DAS NEUE PARTY-HINTERGRUNDBILD */
            background-image: url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: #f5f6fa;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Ein dunkler Filter über dem Hintergrund, damit man die Schrift noch gut lesen kann */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }
        .container {
            width: 100%;
            max-width: 750px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        h1 {
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
        }
        .subtitle {
            text-align: center;
            margin-bottom: 2rem;
            color: #ecf0f1;
            font-size: 1.1rem;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
        }
        .form-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 2rem;
            color: #333;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }
        .form-group {
            flex: 1;
            min-width: 180px;
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #2c3e50;
        }
        input, select {
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            background: #fff;
            color: #333;
        }
        input:focus, select:focus {
            border-color: #3498db;
        }
        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }
        .btn-submit:hover {
            background: #219653;
        }
        .btn-submit:active {
            transform: scale(0.99);
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            background: rgba(0, 0, 0, 0.4);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            color: white;
        }
        .controls label {
            font-size: 0.9rem;
            font-weight: 500;
        }
        .controls select {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
            background: rgba(255,255,255,0.9);
            border: none;
            color: #333;
            border-radius: 4px;
        }
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            text-align: left;
        }
        th, td {
            padding: 1rem;
            border-bottom: 1px solid #e0e0e0;
        }
        th {
            background-color: #2c3e50;
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        .badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: bold;
            text-align: center;
        }
        .badge-alk {
            background-color: #e74c3c;
            color: white;
        }
        .badge-alkfrei {
            background-color: #2ecc71;
            color: white;
        }
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #ecf0f1;
            font-style: italic;
        }
        @media (max-width: 480px) {
            .form-row {
                flex-direction: column;
            }
            .container {
                padding: 1rem;
            }
            h1 {
                font-size: 1.8rem;
            }
            .controls {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🍻 Getränke-Wunschliste</h1>
        <div class="subtitle">Trag ein, was du trinken möchtest! Alle Freunde sehen die Liste live.</div>

        <div class="form-container">
            <div class="form-row">
                <div class="form-group">
                    <label for="nameInput">Dein Name</label>
                    <input type="text" id="nameInput" placeholder="Z.B. Max" required>
                </div>
                <div class="form-group">
                    <label for="drinkInput">Dein Getränk</label>
                    <input type="text" id="drinkInput" placeholder="Z.B. Weizen, Cola, Spezi..." required>
                </div>
                <div class="form-group">
                    <label for="typeInput">Kategorie</label>
                    <select id="typeInput">
                        <option value="alkoholisch">Mit Alkohol 🍺</option>
                        <option value="alkoholfrei">Alkoholfrei 🥤</option>
                    </select>
                </div>
            </div>
            <button class="btn-submit" onclick="addDrink()">Eintrag hinzufügen</button>
        </div>

        <div class="controls">
            <div>
                <label for="filterSelect">Anzeigen: </label>
                <select id="filterSelect" onchange="renderTable()">
                    <option value="all">Alle Getränke</option>
                    <option value="alkoholisch">Nur mit Alkohol</option>
                    <option value="alkoholfrei">Nur alkoholfrei</option>
                </select>
            </div>
            <div>
                <label for="sortSelect">Sortieren nach: </label>
                <select id="sortSelect" onchange="renderTable()">
                    <option value="latest">Neueste zuerst</option>
                    <option value="name">Name (A-Z)</option>
                    <option value="drink">Getränk (A-Z)</option>
                </select>
            </div>
        </div>

        <div class="table-responsive">
            <table id="drinkTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Getränk</th>
                        <th>Typ</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    </tbody>
            </table>
            <div id="emptyMessage" class="empty-state" style="display: none;">Noch keine Wünsche eingetragen...</div>
        </div>
    </div>

    <script>
        // Deine echten Supabase Zugangsdaten sind hier direkt eingebaut!
        const supabaseUrl = 'https://hhjumqciyortsdpvhtgi.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhoanVtcWNpeW9ydHNkcHZodGdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwOTk4NzAsImV4cCI6MjA5NjY3NTg3MH0.vjyAd6ksyp1efLqf0OMVDzpNSPoEvH-rrjBamJpmZYc';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);
        
        const isSupabaseConfigured = typeof supabase !== 'undefined';
        let drinksList = [];

        window.onload = function() {
            fetchDrinks();
        };

        // Daten holen
        async function fetchDrinks() {
            if (isSupabaseConfigured) {
                try {
                    let { data, error } = await supabase.from('drinks').select('*');
                    if (error) throw error;
                    drinksList = data || [];
                } catch (err) {
                    console.error("Fehler bei Supabase:", err.message);
                    alert("Achtung: Konnte Daten nicht laden. Fehler: " + err.message);
                }
            }
            renderTable();
        }

        // Tabelle filtern, sortieren und zeichnen
        function renderTable() {
            const tableBody = document.getElementById('tableBody');
            const emptyMessage = document.getElementById('emptyMessage');
            const filterValue = document.getElementById('filterSelect').value;
            const sortValue = document.getElementById('sortSelect').value;

            tableBody.innerHTML = '';

            // 1. Filtern
            let filteredList = drinksList.filter(item => {
                if (filterValue === 'all') return true;
                return item.type === filterValue;
            });

            // 2. Sortieren
            filteredList.sort((a, b) => {
                if (sortValue === 'name') {
                    return a.name.localeCompare(b.name);
                } else if (sortValue === 'drink') {
                    return a.drink.localeCompare(b.drink);
                } else {
                    return new Date(b.created_at || 0) - new Date(a.created_at || 0);
                }
            });

            // 3. Generieren
            if (filteredList.length === 0) {
                emptyMessage.style.display = 'block';
            } else {
                emptyMessage.style.display = 'none';
                filteredList.forEach(entry => {
                    const row = document.createElement('tr');

                    const nameTd = document.createElement('td');
                    nameTd.textContent = entry.name;

                    const drinkTd = document.createElement('td');
                    drinkTd.textContent = entry.drink;

                    const typeTd = document.createElement('td');
                    const badge = document.createElement('span');
                    badge.className = `badge ${entry.type === 'alkoholisch' ? 'badge-alk' : 'badge-alkfrei'}`;
                    badge.textContent = entry.type === 'alkoholisch' ? 'Mit Alkohol' : 'Alkoholfrei';
                    typeTd.appendChild(badge);

                    row.appendChild(nameTd);
                    row.appendChild(drinkTd);
                    row.appendChild(typeTd);
                    tableBody.appendChild(row);
                });
            }
        }

        // Neue Getränke hinzufügen
        async function addDrink() {
            const nameInput = document.getElementById('nameInput');
            const drinkInput = document.getElementById('drinkInput');
            const typeInput = document.getElementById('typeInput');

            const name = nameInput.value.trim();
            const drink = drinkInput.value.trim();
            const type = typeInput.value;

            if (!name || !drink) {
                alert("Bitte fülle Name und Getränk aus!");
                return;
            }

            // Wir lassen created_at weg, da die Datenbank die Uhrzeit selbst setzt!
            const newEntry = {
                name: name,
                drink: drink,
                type: type
            };

            if (isSupabaseConfigured) {
                try {
                    const { error } = await supabase.from('drinks').insert([newEntry]);
                    if (error) throw error;
                    
                    // Erfolgsmeldung für dich!
                    alert("Getränk erfolgreich hinzugefügt! 🍻");
                    
                    // Liste sofort neu aus der Datenbank laden
                    await fetchDrinks();
                } catch (err) {
                    alert("Fehler beim Speichern: " + err.message);
                }
            }

            // Felder leeren
            nameInput.value = '';
            drinkInput.value = '';
        }
    </script>
</body>
</html>
